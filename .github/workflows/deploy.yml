      - name: Build for GitHub Pages (Stub Mode)
        env:
          VITE_STUB_MODE: "true"
        run: |
          npm run build
          cp dist/index.html dist/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./dist"
